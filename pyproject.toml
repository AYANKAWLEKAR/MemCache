[project]
name = "memcache"
version = "0.1.0"
description = "Episodic memory infrastructure for long-running agents"
requires-python = ">=3.11"

[project.scripts]
memcache-demo = "app.demo_agent:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
markers = [
    "integration: marks tests requiring docker-compose stack (deselect with '-m \"not integration\"')",
    "agentic: end-to-end tests driven by a local Ollama agent (needs the stack + Ollama)",
]
